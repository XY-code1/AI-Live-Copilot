[project]
name = "ai-live-copilot-api"
version = "0.1.0"
description = "AI Live Copilot API"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "psycopg[binary]>=3.2,<4",
  "pymupdf>=1.24,<2",
  "python-multipart>=0.0.9,<1",
  "beautifulsoup4>=4.12,<5",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.34,<1",
  "clerk-backend-api>=7.1.0",
  "sentry-sdk[fastapi]>=2.75.0",
  "pillow>=13.0.0",
]

[project.optional-dependencies]
ocr = [
    "paddleocr>=3.3,<4",
    "paddlepaddle>=3.2,<4",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# FastAPI declares dependencies via `Depends(...)` defaults by design.
extend-ignore = ["B008"]

